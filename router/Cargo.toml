[package]
name = "beyond-routing-filter"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Praxis HTTP filter for smart multi-turn LLM routing: llm-d-sc semantic classification + body-based MaaS model selection"
license = "MIT"
publish = false

# Marker consumed by the Praxis server's build-time filter discovery
# (`server/build.rs` walks `cargo metadata` looking for this key).
[package.metadata.praxis-filters]

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
http = "1.5.0"
metrics = "0.24.6"
# Sourced from the upstream repo, not a local path: an absolute path here would
# not exist on anyone else's machine, and would ALSO make Cargo treat this
# crate's copy of praxis-filter as a distinct instance from whatever the
# consuming workspace uses -- two instances of the same type is a hard compile
# error the moment this crate is `git`-included elsewhere (E0308, "multiple
# different versions of crate praxis_filter in the dependency graph").
#
# A consumer that vendors/patches praxis-proxy/praxis locally (as this PoC's
# Containerfile.praxis does) unifies this back to ONE instance via a
# [patch."https://github.com/praxis-proxy/praxis"] entry in the praxis workspace
# root Cargo.toml -- see Containerfile.praxis.
praxis-core = { version = "0.7.5", git = "https://github.com/praxis-proxy/praxis", tag = "v0.7.5", package = "praxis-proxy-core" }
praxis-filter = { version = "0.7.5", git = "https://github.com/praxis-proxy/praxis", tag = "v0.7.5", package = "praxis-proxy-filter" }
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Conversation fingerprinting (the session module's stable conversation key:
# SHA-256 over the first message, hex-truncated). A std DefaultHasher would be
# zero-dep but is only stable within one rustc version -- a praxis rebuild
# would silently re-group every conversation lane.
sha2 = "0.10"
# NOTE: matches the Praxis v0.7.5 workspace pin exactly; `serde_yaml` must
# resolve to this crate because `export_filters!` expands to `serde_yaml::Value`.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
# Only used by the `test-server` scaffolding (see the feature below).
tokio-stream = { version = "0.1.19", features = ["net"], optional = true }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"

[build-dependencies]
tonic-prost-build = "0.14.6"

[features]
default = []
# Generates the `classify.Classify` *server* stubs in addition to the client.
# Off for a normal build (the filter ships a client only); turned on for
# `cargo test` by the self dev-dependency below so the integration suite can
# stand up an in-process stub server.
test-server = ["dep:tokio-stream", "tokio/net", "tokio/sync", "tokio/rt"]

[dev-dependencies]
# Self dev-dependency: turns on `test-server` for `cargo test` only, so the
# shipped `cargo build` still generates a client and nothing else.
beyond-routing-filter = { path = ".", features = ["test-server"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net"] }
