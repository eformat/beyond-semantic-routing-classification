# Static resources plus the ConfigMap generated from deploy/config/.
#
# NOT included here: the `maas-api-key` Secret. It is created imperatively at
# deploy time, precisely so that no file in this repository ever holds the
# credential (see deploy/secret.example.yaml for the shape).
#
# `oc apply -k deploy/` therefore produces everything except that Secret.
# NOTE: 00-namespace.yaml is deliberately NOT in resources. The deploy target
# is the PRE-EXISTING user-mhepburn sandbox (227d old) -- applying a Namespace
# object into it would patch the user's live namespace. The file stays for the
# future GitOps wiring (beyond-routing ns in rhoai-cluster-pool).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user-mhepburn

resources:
  - 10-imagestream.yaml
  - 15-llm-d-sc-deployment.yaml
  - 16-llm-d-sc-service.yaml
  - 20-buildconfig.yaml
  - 30-deployment.yaml
  - 40-service.yaml
  - 50-route.yaml
  # Phase 1: the decision collector (flow graphic + Prometheus metrics).
  # NOT included: 00-namespace (pre-existing sandbox) and
  # 80-collector-servicemonitor (needs the UWM namespace label — a GitOps
  # mutation outside this repo).
  - 60-collector-rbac.yaml
  - 65-collector-deployment.yaml
  - 70-collector-service.yaml
  - 75-collector-route.yaml
  # Phase 2 Arm A: the RHOAI-reference pair (Qwen3-0.6B + Qwen3-8B on the
  # rhaiis vLLM 0.13 stack) — RETIRED from the cluster for now (frees 2 MIG
  # slots); the manifests stay here as the as-deployed RHOAI baseline, one
  # `make deploy` re-adds it. NOT in kustomization resources while retired.
  # - 85-phase2-llmisvc.yaml
  # Phase 2 arm Routes: one external TLS Route per substrate arm (the laptop
  # picks the substrate by endpoint — praxis-arm-b/praxis-arm-c hosts).
  - 95-arm-routes.yaml
  # ARM D: BOTH models on ONE MIG 3g.71gb slice, kvcached allocating the KV
  # memory elastically (the elastic memory-SHARING thesis).
  - 97-arm-d.yaml
  # Phase 2 three-arm substrate comparison: six LLMISVCs on the kvcached
  # image (a- = native APC, b- = kvcached no-APC, c- = kvcached + APC), all
  # on the SAME engine (vLLM 0.30).
  - 90-phase2-arms.yaml

# Stable names: the Deployment references `praxis-config` directly, and the
# deploy flow swaps that ConfigMap's contents to switch config variants.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: beyond-semantic-routing

configMapGenerator:
  # The live config. deploy/config/praxis-config.yaml is the single source of
  # truth: the same file is validated inside the image build. To switch the
  # routing variant to the phase-2 Arm A fleet (Qwen3-0.6B + 8B on MIG
  # slices), swap the `files:` entry to `praxis.yaml=config/praxis-config-phase2.yaml`
  # and make deploy (the initContainer re-renders at the next pod start).
  - name: praxis-config
    files:
      - praxis.yaml=config/praxis-config-phase2.yaml
