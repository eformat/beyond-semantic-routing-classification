# ============================================================================
# PHASE 2 CONFIG VARIANT — the article replication fleet (Arm A).
#
# This is the Arm A routing config: the Qwen3-0.6B (small) + Qwen3-8B (strong)
# LLMInferenceServices on unreserved MIG slices, PREFIX-CACHED serving.
# Switching to it = the ConfigMap swap in the deploy flow (the same praxis
# image validates against both variants).
#
# Differences from the phase-0 MaaS config (praxis-config.yaml):
#   - TWO clusters (one per model) instead of one shared MaaS endpoint: the
#     label->cluster map selects small vs strong, and each cluster's
#     http.base_path /v1 reaches its own vLLM.
#   - NO credential_injection: the in-cluster KServe endpoints need no auth.
#   - Cluster TLS verify: false — the KServe workload certs are self-signed
#     (the per-pod /var/run/kserve/tls chain); allow_tls_no_verify enables the
#     skip. This is in-cluster east-west traffic inside one namespace, not a
#     trust boundary.
#   - The label->model map is the STARTING point (small for easy turns, strong
#     for hard); the phase-2 matrix run MEASURES the real table and replaces
#     this map.
# ============================================================================
# The admin listener carries the Kubernetes probes (praxis v0.7.5 moved
# /healthy, /ready and /metrics to the dedicated admin.metrics_address
# listener; the probes target the metrics port, not the admin port).
admin:
  address: "0.0.0.0:9901"
  metrics_address: "0.0.0.0:9902"
  verbose: true

insecure_options:
  allow_public_admin: true
  # The KServe workload certs are self-signed per pod; skip upstream verify
  # for the in-cluster east-west hop.
  allow_tls_no_verify: true

listeners:
  - name: http
    address: "0.0.0.0:8080"
    filter_chains: [arm-a]
  # PHASE 2: the Arm B listener — one praxis, one port per substrate arm.
  # Chain A routes to the prefix-cached LLMISVC slices; chain B routes to the
  # kvcached substrate (elastic KV, --no-enable-prefix-caching); chain C to
  # kvcached + bounded APC. The SAME conversation replayed through the three
  # ports is the substrate comparison; the cluster names carry the arm prefix
  # so the access log's `cluster` field shows which arm served each turn.
  - name: http-arm-b
    address: "0.0.0.0:8081"
    filter_chains: [arm-b]
  - name: http-arm-c
    address: "0.0.0.0:8082"
    filter_chains: [arm-c]

filter_chains:
  - name: arm-a
    filters:
      # Sets x-request-id, reused as the ClassifyRequest request_id so a
      # classification correlates with the access-log line for the request.
      - filter: request_id

      # One JSON record per request carrying the routing decision + the
      # session dimension (see the phase-0 config for the full field notes).
      - filter: access_log
        request_headers: [user-agent, x-session-id]
        fields:
          - method
          - path
          - client_ip
          - status
          - duration_ms
          - cluster
          - upstream
          - request_id
          - request_body_bytes
          - response_body_bytes
          - metadata.llm_d_sc.status
          - metadata.llm_d_sc.label
          - metadata.llm_d_sc.model
          - metadata.llm_d_sc.score
          - metadata.llm_d_sc.cluster
          - metadata.llm_d_sc.latency_us
          - metadata.llm_d_sc.session_fp
          - metadata.llm_d_sc.prompt
          - metadata.llm_d_sc.turns
          - request_header.user-agent
          - request_header.x-session-id

      # The classifier. Phase-2 tier map (STARTING point — the matrix run
      # measures the real table): the 0.6B serves easy turns, the 8B hard
      # ones. default_cluster/default_model = fail-open to the small model.
      # Cluster names carry the arm prefix (a- = the prefix-cached LLMISVC
      # slices) so the access log's `cluster` field shows the arm per turn.
      - filter: llm_d_sc
        endpoint: "llm-d-sc:50051"
        default_cluster: a-qwen3-06b
        default_model: a-qwen3-06b
        timeout_ms: 100
        routes:
          - {label: SIMPLE,    cluster: a-qwen3-06b, model: a-qwen3-06b}
          - {label: MEDIUM,    cluster: a-qwen3-06b, model: a-qwen3-06b}
          - {label: COMPLEX,   cluster: a-qwen3-8b,  model: a-qwen3-8b}
          - {label: REASONING, cluster: a-qwen3-8b,  model: a-qwen3-8b}

      # Belt-and-braces body splice: the beyond-routing filter already rewrites
      # /model itself in the body phase (ReadWrite); this idempotently applies
      # the same metadata-sourced replace. Skips when the metadata is absent.
      - filter: json_body
        content_types:
          - application/json
        max_body_bytes: 10485760
        on_invalid: continue
        request_replace:
          - pointer: /model
            metadata: llm_d_sc.model

      # Two upstreams: one per model. NO credential_injection — the in-cluster
      # KServe endpoints need no auth.
      #
      # - tls.verify: false — the KServe workload certs are self-signed
      #   per-pod (/var/run/kserve/tls); allow_tls_no_verify enables the skip.
      # - http.base_path: /v1 is prepended on the upstream leg only (vLLM's
      #   OpenAI server lives under /v1).
      # - trusted_private_endpoints: the in-cluster service DNS resolves to
      #   RFC 1918 addresses, which praxis refuses unless allow-listed here.
      - filter: load_balancer
        clusters:
          - name: a-qwen3-06b
            endpoints:
              - "a-qwen3-06b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "a-qwen3-06b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000
          - name: a-qwen3-8b
            endpoints:
              - "a-qwen3-8b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "a-qwen3-8b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000

  # ---------------------------------------------------------------------------
  # ARM B — the kvcached substrate (elastic KV via the autopatch,
  # --no-enable-prefix-caching: full re-prefill every turn, marginal switch
  # cost ≈ 0). Per-model LLMISVC endpoints, same as arm A.
  # ---------------------------------------------------------------------------
  - name: arm-b
    filters:
      - filter: request_id

      - filter: access_log
        request_headers: [user-agent, x-session-id]
        fields:
          - method
          - path
          - client_ip
          - status
          - duration_ms
          - cluster
          - upstream
          - request_id
          - request_body_bytes
          - response_body_bytes
          - metadata.llm_d_sc.status
          - metadata.llm_d_sc.label
          - metadata.llm_d_sc.model
          - metadata.llm_d_sc.score
          - metadata.llm_d_sc.cluster
          - metadata.llm_d_sc.latency_us
          - metadata.llm_d_sc.session_fp
          - metadata.llm_d_sc.prompt
          - metadata.llm_d_sc.turns
          - request_header.user-agent
          - request_header.x-session-id

      # Same label->model map as arm A: the comparison replays the same
      # conversations through all three arms, so the substrate is the only
      # difference.
      - filter: llm_d_sc
        endpoint: "llm-d-sc:50051"
        default_cluster: b-qwen3-06b
        default_model: b-qwen3-06b
        timeout_ms: 100
        routes:
          - {label: SIMPLE,    cluster: b-qwen3-06b, model: b-qwen3-06b}
          - {label: MEDIUM,    cluster: b-qwen3-06b, model: b-qwen3-06b}
          - {label: COMPLEX,   cluster: b-qwen3-8b,  model: b-qwen3-8b}
          - {label: REASONING, cluster: b-qwen3-8b,  model: b-qwen3-8b}

      - filter: json_body
        content_types:
          - application/json
        max_body_bytes: 10485760
        on_invalid: continue
        request_replace:
          - pointer: /model
            metadata: llm_d_sc.model

      - filter: load_balancer
        clusters:
          - name: b-qwen3-06b
            endpoints:
              - "b-qwen3-06b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "b-qwen3-06b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000
          - name: b-qwen3-8b
            endpoints:
              - "b-qwen3-8b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "b-qwen3-8b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000

  # ---------------------------------------------------------------------------
  # ARM C — kvcached + native APC: elastic memory AND bounded prefix reuse.
  # The A↔C pair compares native APC (arm A, static) vs kvcached APC (elastic).
  # ---------------------------------------------------------------------------
  - name: arm-c
    filters:
      - filter: request_id

      - filter: access_log
        request_headers: [user-agent, x-session-id]
        fields:
          - method
          - path
          - client_ip
          - status
          - duration_ms
          - cluster
          - upstream
          - request_id
          - request_body_bytes
          - response_body_bytes
          - metadata.llm_d_sc.status
          - metadata.llm_d_sc.label
          - metadata.llm_d_sc.model
          - metadata.llm_d_sc.score
          - metadata.llm_d_sc.cluster
          - metadata.llm_d_sc.latency_us
          - metadata.llm_d_sc.session_fp
          - metadata.llm_d_sc.prompt
          - metadata.llm_d_sc.turns
          - request_header.user-agent
          - request_header.x-session-id

      - filter: llm_d_sc
        endpoint: "llm-d-sc:50051"
        default_cluster: c-qwen3-06b
        default_model: c-qwen3-06b
        timeout_ms: 100
        routes:
          - {label: SIMPLE,    cluster: c-qwen3-06b, model: c-qwen3-06b}
          - {label: MEDIUM,    cluster: c-qwen3-06b, model: c-qwen3-06b}
          - {label: COMPLEX,   cluster: c-qwen3-8b,  model: c-qwen3-8b}
          - {label: REASONING, cluster: c-qwen3-8b,  model: c-qwen3-8b}

      - filter: json_body
        content_types:
          - application/json
        max_body_bytes: 10485760
        on_invalid: continue
        request_replace:
          - pointer: /model
            metadata: llm_d_sc.model

      - filter: load_balancer
        clusters:
          - name: c-qwen3-06b
            endpoints:
              - "c-qwen3-06b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "c-qwen3-06b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000
          - name: c-qwen3-8b
            endpoints:
              - "c-qwen3-8b-kserve-workload-svc:8000"
            http:
              base_path: /v1
            tls:
              verify: false
            trusted_private_endpoints:
              - "c-qwen3-8b-kserve-workload-svc"
            connection_timeout_ms: 5000
            total_connection_timeout_ms: 10000
