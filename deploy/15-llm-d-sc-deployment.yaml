# The llm-d-sc semantic classifier: the gRPC signal producer the praxis
# llm_d_sc filter calls to classify every request.
#
# Ported from llm-d-semantic-classifier/deploy/topology-b-clusterip.yaml
# (classifier in its own Pod, reached over a ClusterIP Service). The model
# loads from a ModelCar image copied into a shared emptyDir by an
# initContainer; the standard grpc.health.v1 readiness probe blocks traffic
# until load and warmup finish, so a failed ModelCar never becomes an endpoint.
#
# Images are vendor-neutral placeholders (`llm-d-sc/...:latest`). They are
# built in the llm-d-semantic-classifier repo and must be rewritten to a
# concrete, cluster-registry reference at deploy time - see deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-sc
  labels:
    app.kubernetes.io/name: llm-d-sc
    app.kubernetes.io/part-of: beyond-semantic-routing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc
        app.kubernetes.io/part-of: beyond-semantic-routing
    spec:
      volumes:
        - name: models
          emptyDir: {}
      initContainers:
        # ModelCar: copies the bundled model files into the shared volume.
        - name: modelcar
          image: quay.io/eformat/llm-d-sc-modelcar:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp -R /models/. /shared/"]
          volumeMounts:
            - name: models
              mountPath: /shared
      containers:
        - name: llm-d-sc
          image: quay.io/eformat/llm-d-sc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LLM_D_SC_MODEL_DIR
              value: /models
            - name: LLM_D_SC_CLASSIFIER
              value: complexity
            - name: LLM_D_SC_LISTEN
              value: "0.0.0.0:50051"
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
          # Readiness must block traffic until the model is warm: the Service
          # only adds the Pod as an endpoint once this passes. The standard
          # grpc.health.v1 protocol is served on the same port as classify;
          # the listener only binds - and Check starts answering SERVING -
          # after load and warmup succeed.
          readinessProbe:
            # grpc.health.v1 protocol is served on the same port as classify;
            # the numeric port is required here (K8s GRPCAction.port is
            # int32-only -- unlike httpGet.port, it cannot take a port NAME).
            grpc: {port: 50051}
            initialDelaySeconds: 3
            periodSeconds: 2
          # OpenShift's restricted-v2 SCC assigns the UID; the image is built
          # to run with any non-root identity.
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
