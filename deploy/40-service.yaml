# Data plane only.
#
# Port 9901 (the Praxis admin listener: /healthy, /ready, /metrics) is
# deliberately NOT published here. That listener has no authentication - Praxis
# requires insecure_options.allow_public_admin to bind it off-loopback at all -
# so it is reachable only by the kubelet for probes and by `oc port-forward`
# for debugging, never through the Service or the Route.
apiVersion: v1
kind: Service
metadata:
  name: praxis
  labels:
    app.kubernetes.io/name: praxis
    app.kubernetes.io/part-of: beyond-semantic-routing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: praxis
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # PHASE 2: the Arm B data plane — one praxis, one listener per substrate
    # arm. Chain A on :8080 routes to the prefix-cached slices; chain B on
    # :8081 to the kvcached no-APC substrate; chain C on :8082 to kvcached +
    # bounded APC. Clients pick the arm by port; the access log's cluster
    # field shows which arm served each turn.
    - name: http-arm-b
      port: 8081
      targetPort: http-arm-b
      protocol: TCP
    - name: http-arm-c
      port: 8082
      targetPort: http-arm-c
      protocol: TCP
    - name: http-arm-d
      port: 8083
      targetPort: http-arm-d
      protocol: TCP
