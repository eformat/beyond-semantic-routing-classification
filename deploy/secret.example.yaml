# PLACEHOLDER ONLY - DO NOT PUT THE REAL MaaS KEY IN THIS FILE.
#
# This file documents the shape the manifests expect. It is NOT applied by
# kustomize and NOT applied by any script in this repo.
#
# The real Secret is created imperatively at deploy time, so no file in this
# repository ever holds the credential:
#
#   oc create secret generic maas-api-key -n beyond-routing \
#     --from-literal=key=<MAAS_API_KEY>
#
# Both the praxis container and its render-config initContainer resolve the
# value through secretKeyRef (name maas-api-key, key key); the
# credential_injection filter reads it from the environment at construction.
apiVersion: v1
kind: Secret
metadata:
  name: maas-api-key
  namespace: beyond-routing
  labels:
    app.kubernetes.io/part-of: beyond-semantic-routing
type: Opaque
stringData:
  key: "<MAAS_API_KEY>"
